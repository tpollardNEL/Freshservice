<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
</head>
<body>
<script>
fetch('images.json')
  .then(response => response.json())
  .then(images => {
      const randomImage =
          images[Math.floor(Math.random() * images.length)];

      window.location.replace(
          'images/' + randomImage
      );
  });
</script>
</body>
</html>
