name: Update Image List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate image list
        run: |
          find images -name "*.png" \
            -exec basename {} \; \
            | jq -R . \
            | jq -s . > images.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add images.json

          git diff --staged --quiet || git commit -m "Update image list"

          git push
