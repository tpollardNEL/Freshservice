name: Rotate Current Image

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate image list
        run: |
          find images -name "*.png" \
            -exec basename {} \; \
            | jq -R . \
            | jq -s . > images.json

      - name: Pick random image (different from current)
        run: |
          CURRENT_HASH=$(sha256sum current.png | cut -d' ' -f1)

          while true; do
            FILE=$(find images -name "*.png" | shuf -n 1)
            NEW_HASH=$(sha256sum "$FILE" | cut -d' ' -f1)

            if [ "$CURRENT_HASH" != "$NEW_HASH" ]; then
              echo "Selected: $FILE"
              cp "$FILE" current.png
              break
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add current.png images.json

          git diff --staged --quiet || git commit -m "Rotate image"

          git push
